# A push that changes app code builds the apps; if every platform builds, ONE job publishes a complete release
# (v0.1.<run>, marked latest, 10 kept). A failed platform publishes nothing, so "latest" always has every download.
#   desktop: Windows (.exe), macOS (universal .dmg), Linux (.deb, .rpm) · android: a debug-signed preview APK
# Minutes matter (macOS runners count 10×, Windows 2×): docs-only pushes don't build, a newer push cancels an older
# run, and Rust, apt, npm and Gradle are all cached. Run by hand: Actions → release → Run workflow.
name: release
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'android/**', 'shared/**', 'fetch-corvax.sh', '.github/workflows/release.yml']
  workflow_dispatch:

permissions: { contents: write }
concurrency: { group: release, cancel-in-progress: true }

jobs:
  desktop:
    strategy:
      fail-fast: true                             # one failed platform stops the others: no release either way
      matrix:
        include:
          - { os: ubuntu-22.04, args: "", files: "desktop/src-tauri/target/release/bundle/deb/*.deb\ndesktop/src-tauri/target/release/bundle/rpm/*.rpm" }
          - { os: macos-latest, args: "--target universal-apple-darwin", files: "desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg" }
          - { os: windows-latest, args: "", files: "desktop/src-tauri/target/release/bundle/nsis/*.exe" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2                # dependencies compile once; later runs only build our crate
        with: { workspaces: desktop/src-tauri, cache-on-failure: true }
      - if: startsWith(matrix.os, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@v1
        with: { packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev, version: 1 }
      - name: CORVAX core (from npm)
        shell: bash
        run: ./fetch-corvax.sh
      - name: Build
        working-directory: desktop
        shell: bash
        run: npm ci && npm run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.os }}", path: "${{ matrix.files }}", if-no-files-found: error, retention-days: 1 }

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4        # caches Gradle, its dependencies and build outputs
        with: { gradle-version: "8.11.1" }
      - name: CORVAX core (from npm)
        run: ./fetch-corvax.sh
      - run: gradle -p android assembleDebug --build-cache
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk corvax-android-preview.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: corvax-android-preview.apk, if-no-files-found: error, retention-days: 1 }

  publish:
    needs: [desktop, android]                       # runs only when every build succeeded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release (complete), mark latest, keep the 10 newest, drop incomplete ones
        run: |
          find dist -mindepth 2 -type f -exec mv {} dist/ \; && find dist -mindepth 1 -type d -empty -delete   # flat: one file per download
          ls -la dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "CORVAX apps $TAG" --latest --target "$GITHUB_SHA" --notes \
            "CORVAX node apps: a CORVAX node in the background, the CORVAX app in a window.
          Windows: .exe installer · macOS: .dmg (Apple silicon and Intel) · Linux: .deb or .rpm · Android: corvax-android-preview.apk (preview, not yet tested on devices).
          Unsigned builds: on macOS right-click → Open the first time; on Windows choose \"More info\" → \"Run anyway\"."
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName'); do
            [ "$t" = "$TAG" ] && continue
            gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -q '\.dmg$' ||
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:][].tagName' |
            xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
