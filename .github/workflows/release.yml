# A push that changes app code builds the apps and publishes them as one GitHub release (v0.1.<run>), 10 kept.
#   desktop: Windows (.exe), macOS (universal .dmg), Linux (.deb, .rpm) · android: a debug-signed preview APK
# Minutes matter (macOS runners count 10×, Windows 2×): docs-only pushes don't build, a newer push cancels an older
# run, and Rust, apt, npm and Gradle are all cached. Run by hand: Actions → release → Run workflow.
name: release
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'android/**', 'shared/**', 'fetch-corvax.sh', '.github/workflows/release.yml']
  workflow_dispatch:

permissions: { contents: write }
concurrency: { group: release, cancel-in-progress: true }
env:
  TAG: v0.1.${{ github.run_number }}
  NOTES: |
    CORVAX node apps: a CORVAX node in the background, the CORVAX app in a window.
    Desktop: Windows (.exe), macOS (.dmg, Apple silicon and Intel), Linux (.deb, .rpm).
    Android: corvax-android-preview.apk (preview, not yet tested on devices).
    Unsigned builds: macOS needs right-click → Open the first time; Windows may show SmartScreen ("More info" → "Run anyway").

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, args: "" }
          - { os: macos-latest, args: "--target universal-apple-darwin" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2                # dependencies compile once; later runs only build our crate
        with: { workspaces: desktop/src-tauri, cache-on-failure: true }
      - if: startsWith(matrix.os, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@v1
        with: { packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev, version: 1 }
      - name: CORVAX core (from npm)
        shell: bash
        run: ./fetch-corvax.sh
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          projectPath: desktop
          tagName: ${{ env.TAG }}
          releaseName: CORVAX apps ${{ env.TAG }}
          releaseBody: ${{ env.NOTES }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: desktop
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4        # caches Gradle, its dependencies and build outputs
        with: { gradle-version: "8.11.1" }
      - name: CORVAX core (from npm)
        run: ./fetch-corvax.sh
      - run: gradle -p android assembleDebug --build-cache
      - name: Attach the preview APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk corvax-android-preview.apk
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CORVAX apps $TAG" --notes "$NOTES"
          gh release upload "$TAG" corvax-android-preview.apk --clobber
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:][].tagName' |
            xargs -r -n1 gh release delete --yes --cleanup-tag
