<!doctype html>
<meta charset="utf-8">
<!-- Loaded headless by NodeService from https://appassets.androidplatform.net/assets/node.html (a secure origin,
     so WebCrypto works). Runs CORVAX's node bundle with the Android host. -->
<script>
  // Any startup failure goes to the app screen and the notification (node_failed), not into the void.
  const failed = msg => { try { CorvaxHost.call(0, 'node_failed', JSON.stringify({ error: String(msg).slice(0, 300) })) } catch {} }
  addEventListener('error', e => failed(e.message || 'script error'))
  addEventListener('unhandledrejection', e => failed(e.reason?.message || e.reason))
</script>
<script type="module">
  const log = m => { console.log(m); try { CorvaxHost.call(0, 'log', JSON.stringify({ m: String(m) })) } catch {} }
  log('node.html running')
  try {
    const { startNode } = await import('./shared/host-bridge.js')
    log('host-bridge.js loaded')
    const handlers = new Map(), pending = new Map(); let next = 0
    // Kotlin → JS: window.__host.emit(event, payload) and window.__host.reply(callId, result, error)
    window.__host = {
      emit: (event, payload) => (handlers.get(event) || []).forEach(fn => fn(payload)),
      reply: (id, result, error) => { const p = pending.get(id); pending.delete(id); error ? p?.reject(new Error(error)) : p?.resolve(result) }
    }
    const bridge = {
      call: (name, args) => new Promise((resolve, reject) => { const id = ++next; pending.set(id, { resolve, reject }); CorvaxHost.call(id, name, JSON.stringify(args)) }),
      on: (event, fn) => handlers.set(event, [...(handlers.get(event) || []), fn])
    }
    // CORVAX keys need Ed25519 and X25519 in WebCrypto (Chromium ≥ 137): say so plainly when the system WebView is older.
    const can = await crypto.subtle.generateKey({ name: 'Ed25519' }, false, ['sign']).then(() => crypto.subtle.generateKey({ name: 'X25519' }, false, ['deriveBits'])).then(() => true, () => false)
    log('webcrypto Ed25519+X25519: ' + can + ' · ' + navigator.userAgent)
    if (!can) failed('Android System WebView is too old (' + (navigator.userAgent.match(/Chrome\/([\d.]+)/)?.[1] || '?') + '). Update it in the Play Store, then reopen CORVAX.')
    else {
      log('starting node')
      window.node = await startNode(bridge, { relayFor: false, log: m => log(m) })   // policy turns relaying on when on Wi-Fi and charging
      log('node started: ' + window.node.key)
    }
  } catch (e) { failed((e && e.stack) || e) }
</script>
