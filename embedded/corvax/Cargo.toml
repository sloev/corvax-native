[package]
name = "corvax"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CORVAX for ESP32 and native hosts: identity, Beacons, sealed messages, inboxes, WebRTC DataChannels"

[features]
default = ["webrtc"]
webrtc = ["dep:str0m"]          # DataChannels via str0m with its pure-Rust crypto (no OpenSSL): runs on ESP-IDF

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.22"
serde_json = "1"
miniz_oxide = "0.8"
log = "0.4"
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"], optional = true }
